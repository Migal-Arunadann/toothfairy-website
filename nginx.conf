server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Clean URL support: /about -> /about.html
    location / {
        try_files $uri $uri.html $uri/ /index.html =404;
    }

    # Static Assets Cache
    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|ico|svg|woff2|woff)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
